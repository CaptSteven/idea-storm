<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOPFlow</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header>
        <div class="brand-mark">SF</div>
        <div>
          <h1>SOPFlow</h1>
          <p>网页操作转 SOP</p>
        </div>
      </header>

      <section class="status-card">
        <span id="statusLabel">检查当前页面...</span>
        <strong id="stepCount">0 步</strong>
      </section>

      <div class="actions">
        <button id="startButton" class="primary" type="button">开始记录</button>
        <button id="stopButton" class="danger" type="button" disabled>停止并生成</button>
        <button id="openButton" type="button" disabled>打开 SOP</button>
        <button id="historyButton" type="button">历史记录</button>
      </div>

      <section class="settings" aria-label="录制设置">
        <label>
          <input id="screenshotsEnabled" type="checkbox" checked />
          <span>记录步骤截图</span>
        </label>
        <label>
          <input id="autoRedact" type="checkbox" checked />
          <span>自动模糊敏感输入区域</span>
        </label>
      </section>

      <p class="hint">
        文本输入默认不保存原值，URL 会移除查询参数。截图脱敏仍需人工复核。
      </p>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
