<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SOPFlow Session v2 示例工作台" />
    <title>SOPFlow 示例工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="library" aria-label="示例 SOP 列表">
        <header class="brand">
          <div class="brand-mark" aria-hidden="true">SF</div>
          <div>
            <h1>SOPFlow</h1>
            <p>Session v2 工作台</p>
          </div>
        </header>

        <div class="library-actions">
          <button id="newCopy" type="button">创建副本</button>
          <label class="button-like" for="importFile">导入 JSON</label>
          <input id="importFile" type="file" accept="application/json,.json" hidden />
        </div>

        <nav id="sessionList" class="session-list" aria-label="示例记录"></nav>

        <footer class="privacy-state">
          <div><span class="state-dot"></span><strong>隐私规则已应用</strong></div>
          <p>地址参数已移除，文本字段仅保留操作类型。</p>
          <button id="resetDemo" type="button">恢复示例数据</button>
        </footer>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="title-block">
            <p class="eyebrow">SOP WORKBENCH</p>
            <h2 id="documentTitle">加载中...</h2>
            <p id="documentMeta" class="document-meta"></p>
          </div>
          <div class="toolbar" aria-label="文档操作">
            <button id="optimizeButton" class="primary" type="button">示例优化</button>
            <button id="copyMarkdown" type="button">复制 Markdown</button>
            <button id="downloadHtml" type="button">导出 HTML</button>
            <button id="downloadJson" type="button">导出 JSON</button>
            <button id="deleteSession" class="danger" type="button">删除</button>
          </div>
        </header>

        <section class="meta-band" aria-label="SOP 元数据">
          <label>标题<input id="titleInput" type="text" maxlength="160" /></label>
          <label>适用对象<input id="audienceInput" type="text" maxlength="160" /></label>
          <label>版本<input id="versionInput" type="text" maxlength="40" /></label>
          <div class="source-field"><span>来源页面</span><a id="sourceUrl" target="_blank" rel="noreferrer"></a></div>
        </section>

        <div id="statusMessage" class="status-message" role="status" hidden></div>

        <section class="workbench">
          <aside class="steps-pane" aria-label="步骤编辑器">
            <header class="pane-header">
              <div><p class="eyebrow">RECORDED STEPS</p><h3>步骤编辑</h3></div>
              <span id="stepCount" class="count"></span>
            </header>
            <div id="stepsEditor" class="steps-editor"></div>
          </aside>

          <article class="preview-pane" aria-label="SOP 文档预览">
            <header class="pane-header preview-header">
              <div><p class="eyebrow">DOCUMENT PREVIEW</p><h3>交付预览</h3></div>
              <span id="documentState" class="document-state">已保存</span>
            </header>
            <div id="sopOutput" class="sop-output"></div>
          </article>
        </section>
      </main>
    </div>

    <template id="stepTemplate">
      <section class="step-editor">
        <div class="step-media">
          <img class="step-image" alt="" />
          <div class="image-empty">截图已移除</div>
          <button class="remove-image" type="button">移除截图</button>
        </div>
        <div class="step-fields">
          <div class="step-toolbar">
            <strong class="step-label"></strong>
            <div>
              <button class="move-up icon-button" type="button" title="上移" aria-label="上移">↑</button>
              <button class="move-down icon-button" type="button" title="下移" aria-label="下移">↓</button>
              <button class="remove-step" type="button">删除步骤</button>
            </div>
          </div>
          <label>步骤名称<input class="step-title" type="text" maxlength="120" /></label>
          <label>操作说明<textarea class="step-description" rows="3" maxlength="800"></textarea></label>
          <label>检查标准<input class="step-check" type="text" maxlength="300" /></label>
          <label>风险提示<input class="step-risk" type="text" maxlength="300" /></label>
        </div>
      </section>
    </template>

    <script src="extension/shared.js"></script>
    <script type="module" src="app.js"></script>
  </body>
</html>
